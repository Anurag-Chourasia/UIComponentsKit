included:
  - Sources
  - Tests
excluded:
  - .build
  - DerivedData
only_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - duplicate_imports
  - duplicate_conditions
  - duplicate_enum_cases
  - unused_closure_parameter
  - unused_optional_binding
  - unused_setter_value
  - empty_count
  - fatal_error_message
  - syntactic_sugar
  - colon
  - comma
  - opening_brace
  - closing_brace
  - return_arrow_whitespace
  - statement_position
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_whitespace
  - void_return
strict: true
reporter: xcode
