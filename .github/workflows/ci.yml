name: Swift package

on:
  push:
    branches: [main, feature/catalog-tiles]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned SwiftLint
        run: bash Scripts/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"
      - name: Enforce SwiftLint rules
        env:
          SWIFTLINT_BIN: ${{ runner.temp }}/swiftlint/swiftlint
        run: bash Scripts/lint.sh

  build-and-test:
    name: Build & Test
    needs: [swiftlint]
    # Xcode 27 runner is arm64 and currently in public preview.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record and verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "Required Xcode 27.0 is unavailable"; exit 1; }
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          xcrun swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Fxq 'Xcode 27.0' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fxq 'Build version 27A266a' "$RUNNER_TEMP/xcode-version.txt"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          grep -Eq 'Apple Swift version 6\.4([. ]|$)' "$RUNNER_TEMP/swift-version.txt"

      - name: Validate manifest
        run: xcrun swift package dump-package

      - name: Resolve package
        run: xcrun swift package resolve

      - name: Build host validation target with strict concurrency
        run: >-
          xcrun swift build --triple arm64-apple-macosx14.0
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run unit tests with strict concurrency
        run: >-
          xcrun swift test --triple arm64-apple-macosx14.0
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Build iOS Simulator product
        run: >-
          xcodebuild -scheme UIComponentsKit
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/UIComponentsKit"
          SDKROOT=iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          SWIFT_SUPPRESS_WARNINGS=NO
          build

      - name: Test native iOS interactions
        timeout-minutes: 15
        run: bash Validation/run-interactions.sh
